[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscle-arc"
version = "0.1.0"
description = "Automated muscle architecture estimation from ultrasound (UMUD Challenge)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "muscle-arc contributors" }]
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "segmentation-models-pytorch>=0.3.3",
  "albumentations>=1.4.0",
  "opencv-python-headless>=4.9.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.4.0",
  "scikit-image>=0.22.0",
  "Pillow>=10.2.0",
  "tqdm>=4.66.0",
  "PyYAML>=6.0.1",
  "matplotlib>=3.8.0",
  "timm>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
