seed: 42
img_size: 768
device: cuda

data:
  root: data/raw
  apo_imgs: apo_imgs_v1
  apo_masks: apo_masks_v1
  fasc_imgs: fasc_imgs_v1
  fasc_masks: fasc_masks_v1
  test_images: test_images_v2
  sample_submission: sample_submission.csv
  csv_sep: ";"

model:
  architecture: Unet
  encoder: tu-efficientnet_b4
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

train:
  # dual_v3_768 + Skeleton Recall on the fascicle branch (the two lines that helped med5ud).
  # dual_v3 at 768 px input: most training frames are 1200x800 or 1640x1080, so
  # 512-px letterboxing halves fascicle detail. Everything else as dual_v3 (experiments/splits
  # built with make_splits.py dedupe). Fascicle branch: recall-heavy Tversky +
  # Gate1-lite checkpoint selection, as in grow_v2; 60-epoch cap.
  batch_size: 4
  epochs: 60
  lr: 1.5e-4
  weight_decay: 1.0e-4
  num_workers: 6
  val_fraction: 0.15
  early_stop_patience: 10
  use_augments: true
  aug_strength: fasc
  amp: true
  split_dir: experiments/splits
  checkpoint_dir: experiments/checkpoints_dual_v3_768_skel
  fasc_loss: tversky_skelrecall
  skel_recall_weight: 0.3
  tversky_alpha: 0.3
  tversky_beta: 0.7
  gate1_lite_every: 2
  gate1_lite_max_samples: 24
  apo_thr: 0.35
  fasc_thr: 0.10

infer:
  tta_hflip: true
  mask_percentile: 0.30
  apo_thr: 0.35
  fasc_thr: 0.10
  mm_per_pixel: 0.06
  clip:
    pa_deg: [3.0, 40.0]
    fl_mm: [25.0, 140.0]
    mt_mm: [6.0, 45.0]
  temporal_smooth: true
  temporal_window: 5
  multiscale_tta: true
  frangi_enhance_fasc: false

geometry:
  protocol: legacy
