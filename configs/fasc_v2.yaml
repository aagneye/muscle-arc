data:
  apo_imgs: apo_imgs_v1
  apo_masks: apo_masks_v1
  csv_sep: ;
  fasc_imgs: fasc_imgs_v1
  fasc_masks: fasc_masks_v1
  root: data/raw
  sample_submission: sample_submission.csv
  test_images: test_images_v2
device: cuda
img_size: 512
infer:
  clip:
    fl_mm:
    - 20.0
    - 150.0
    mt_mm:
    - 5.0
    - 50.0
    pa_deg:
    - 1.0
    - 45.0
  mask_percentile: 0.35
  mm_per_pixel: 0.06
  temporal_smooth: false
  temporal_window: 5
  tta_hflip: true
model:
  architecture: Unet
  classes: 1
  encoder: tu-efficientnet_b4
  encoder_weights: imagenet
  in_channels: 3
seed: 42
train:
  amp: true
  batch_size: 4
  checkpoint_dir: experiments/checkpoints_fasc_v2
  epochs: 60
  lr: 0.0002
  num_workers: 4
  val_fraction: 0.15
  weight_decay: 0.0001
