seed: 42
img_size: 512
device: cuda

data:
  root: data/raw
  # Kaggle zip uses *_v1 / *_v2 folder names
  apo_imgs: apo_imgs_v1
  apo_masks: apo_masks_v1
  fasc_imgs: fasc_imgs_v1
  fasc_masks: fasc_masks_v1
  test_images: test_images_v2
  sample_submission: sample_submission.csv
  # sample_submission may use ';' as separator on Kaggle
  csv_sep: ";"

model:
  # Separate heads for aponeurosis (MT) and fascicle (PA/FL)
  architecture: Unet
  encoder: tu-efficientnet_b4
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

train:
  batch_size: 4
  epochs: 40
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 4
  val_fraction: 0.15
  amp: true
  checkpoint_dir: experiments/checkpoints

infer:
  tta_hflip: true
  # Probability threshold (not percentile)
  mask_percentile: 0.5
  # Calibrated against sample_submission GT rows (IMG_00001/00002)
  mm_per_pixel: 0.07
  clip:
    pa_deg: [1.0, 45.0]
    fl_mm: [20.0, 150.0]
    mt_mm: [5.0, 50.0]
  temporal_smooth: false
  temporal_window: 5
