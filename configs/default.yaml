seed: 42
img_size: 512
device: cuda

data:
  root: data/raw
  # Kaggle zip uses *_v1 / *_v2 folder names
  apo_imgs: apo_imgs_v1
  apo_masks: apo_masks_v1
  fasc_imgs: fasc_imgs_v1
  fasc_masks: fasc_masks_v1
  test_images: test_images_v2
  sample_submission: sample_submission.csv
  # sample_submission may use ';' as separator on Kaggle
  csv_sep: ";"

model:
  # Separate heads for aponeurosis (MT) and fascicle (PA/FL)
  architecture: Unet
  encoder: tu-efficientnet_b4
  encoder_weights: imagenet
  in_channels: 3
  classes: 1

train:
  batch_size: 4
  epochs: 40
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 4
  val_fraction: 0.15  # fallback if no split manifest
  early_stop_patience: 12
  use_augments: true
  amp: true
  split_dir: experiments/splits
  checkpoint_dir: experiments/checkpoints

infer:
  tta_hflip: true
  # Probability threshold (not percentile). Keep moderate for sparse fascicles.
  mask_percentile: 0.30
  apo_thr: 0.35
  fasc_thr: 0.10
  # Seed scale; calibrate_predict.py refits per-resolution from sample GT.
  mm_per_pixel: 0.06
  clip:
    pa_deg: [3.0, 40.0]
    fl_mm: [25.0, 140.0]
    mt_mm: [6.0, 45.0]
  # Median-smooth contiguous same-shape runs (video snippets).
  temporal_smooth: true
  temporal_window: 5
  multiscale_tta: true
  frangi_enhance_fasc: false
